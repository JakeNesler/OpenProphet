name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Advisory until the pre-existing unformatted files are cleaned up (a whole-tree gofmt
      # would collide with every downstream branch); flip to blocking after that lands.
      - name: gofmt (advisory)
        continue-on-error: true
        run: |
          out=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$out" ]; then echo "::warning::gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # staticcheck v0.8.1 cannot read Go 1.27.2's export data ("export data version 5 is
      # greater than maximum supported version 4"). Patch releases don't change language
      # semantics, so analyze under the previous patch toolchain until staticcheck ships
      # support; then drop this env.
      - name: staticcheck
        env:
          GOTOOLCHAIN: go1.27.1
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  node:
    name: Node (dashboard + MCP)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # better-sqlite3 compiles from source when no prebuilt binary matches; package.json
      # `allowScripts` lets npm ≥12 run that install script.
      - run: npm ci --no-audit --no-fund
      - run: node --check mcp-server.js && node --check agent/server.js
      - run: npm test
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [go, node]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: OPENPROPHET_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
